<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乳腺外来LP — デザイン7案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: #fff;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }
  h1 {
    font-size: 13px;
    font-weight: 400;
    color: #999;
    letter-spacing: 0.1em;
    margin-bottom: 40px;
    width: 100%;
    max-width: 480px;
    text-align: left;
  }
  ul {
    list-style: none;
    width: 100%;
    max-width: 480px;
  }
  li a {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid #F0F0F0;
    text-decoration: none;
    color: #333;
  }
  li:first-child a { border-top: 1px solid #F0F0F0; }
  li a:hover .label { color: #E46381; }
  .letter {
    font-size: 12px;
    color: #E46381;
    font-weight: 400;
    width: 20px;
    flex-shrink: 0;
  }
  .label {
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.03em;
    flex: 1;
  }
  .arrow {
    font-size: 12px;
    color: #CCC;
  }

  /* 参考：不採用の案（グレー表示） */
  .archived .letter,
  .archived .label,
  .archived .arrow { color: #BBB; }
  .archived a:hover .label { color: #999; }

  /* パスワード画面 */
  #gate {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 320px;
  }
  #gate p {
    font-size: 13px;
    color: #999;
    letter-spacing: 0.08em;
    text-align: center;
  }
  #gate input {
    width: 100%;
    border: 1px solid #E0E0E0;
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    text-align: center;
    letter-spacing: 0.15em;
  }
  #gate input:focus { border-color: #E46381; }
  #gate button {
    width: 100%;
    background: #E46381;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-size: 13px;
    font-family: inherit;
    letter-spacing: 0.08em;
    cursor: pointer;
  }
  #gate button:hover { background: #D4537E; }
  #gate .error {
    font-size: 12px;
    color: #E46381;
    display: none;
  }
  #content { display: none; }
</style>
</head>
<body>

<div id="gate">
  <p>吉祥寺レディースクリニック<br>乳腺外来LP デザイン案</p>
  <input type="password" id="pw" placeholder="パスワード" autocomplete="off">
  <button onclick="checkPw()">確認する</button>
  <span class="error" id="err">パスワードが違います</span>
</div>

<div id="content">
  <h1>吉祥寺レディースクリニック 乳腺外来LP — デザイン案</h1>
  <ul>
    <li style="display:none"><a href="variant-a.html"><span class="letter">A</span><span class="label">明朝 × blob浮遊 × サーモン</span><span class="arrow">→</span></a></li>
    <li style="display:none"><a href="variant-b.html"><span class="letter">B</span><span class="label">ベージュ × 丸サンセリフ</span><span class="arrow">→</span></a></li>
    <li style="display:none"><a href="variant-c.html"><span class="letter">C</span><span class="label">無彩色 × アーチ × Cormorant</span><span class="arrow">→</span></a></li>
    <li style="display:none"><a href="variant-d.html"><span class="letter">D</span><span class="label">案Aのピンク版</span><span class="arrow">→</span></a></li>
    <li><a href="../nyusen_lp_v1_1.html"><span class="letter">案1</span><span class="label">乳腺外来</span><span class="arrow">→</span></a></li>
  </ul>

  <p style="font-size:11px; color:#BBB; letter-spacing:0.14em; margin:32px 0 12px; text-transform:uppercase; width:100%; max-width:480px; text-align:left;">その他のデザイン案（参考）</p>
  <ul class="archived">
    <li><a href="variant-f.html"><span class="letter">案2</span><span class="label">丸ゴシック × 鮮やかピンク</span><span class="arrow">→</span></a></li>
    <li><a href="variant-e.html"><span class="letter">案3</span><span class="label">ピーチピンク × ホワイト基調</span><span class="arrow">→</span></a></li>
  </ul>
</div>

<script>
  // ★ パスワードをここで変更できます
  const PASSWORD = 'tlc2026admin';
  const KEY = 'lp_review_auth';

  function checkPw() {
    if (document.getElementById('pw').value === PASSWORD) {
      sessionStorage.setItem(KEY, '1');
      showContent();
    } else {
      document.getElementById('err').style.display = 'block';
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
    }
  }

  function showContent() {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('content').style.display = 'flex';
    document.getElementById('content').style.flexDirection = 'column';
    document.getElementById('content').style.alignItems = 'center';
  }

  document.getElementById('pw').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkPw();
  });

  if (sessionStorage.getItem(KEY) === '1') showContent();
</script>
</body>
</html>
